[bridge]
ami_credentials_file = /etc/sms-bridge/ami.credentials
sip_domain = pbx.example.net
# Set this to the local address phones recognize when route selection differs.
# sip_bind = 192.0.2.10
db_path = /var/lib/sms-bridge/queue.sqlite3
notify_hook =
repeat_hours = 6

[gateway gateway-a]
host = 192.0.2.20
credentials_file = /etc/sms-bridge/gateway-a.credentials
country_code = +1

[endpoint 2001]
gateway = gateway-a
span = 2
numbers = +12025550101, +447700900101

[endpoint 2002]
gateway = gateway-a
span = 3
numbers = +12025550102, +447700900102
