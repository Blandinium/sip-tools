; Extend the existing [messages] context and remove its old MessageSend and
; drop rules. Route numbers, local extensions and replies to named senders
; through the same handler. Only verified phone endpoints use this context.
[messages]
exten => h,1,NoOp()
exten => _.,1,UserEvent(SmsOut,From64:${BASE64_ENCODE(${MESSAGE(from)})},Destination64:${BASE64_ENCODE(${EXTEN})},Body64:${BASE64_ENCODE(${MESSAGE(body)})})
 same => n,Hangup()

; In pjsip.conf, set message_context=messages-drop on trunks and other
; endpoints that must drop MESSAGEs. Their voice contexts stay separate.
[messages-drop]
exten => h,1,NoOp()
exten => _.,1,Log(NOTICE,Dropped SIP MESSAGE from ${MESSAGE(from)} to ${EXTEN})
 same => n,Hangup()
